home:
  title: DescToolsX
  description: Descriptive statistics and exploratory data analysis for the DescToolsX ecosystem

destination: docs

development:
  mode: auto

template:
  default_assets: true
  bootstrap: 5
  bootswatch: flatly
  math-rendering: mathjax

navbar:
  structure:
    left:  [version, home, reference, articles, news]
    right: [github]
  components:
    version:
      icon: fa-book
      menu:
      - text: "Documentation for version of package:"
      - text: Released
        href: https://andrisignorell.github.io/DescToolsX/
      - text: In-development
        href: https://andrisignorell.github.io/DescToolsX/dev/
    articles:
      text: Tutorials
      menu:
      - text: "PDF:"
      - text: Tables in R
        href: https://github.com/AndriSignorell/DescToolsX/blob/main/vignettes/TablesInR.pdf

# About package ==============================================================
reference:
- title: Package Overview & Interfaces

  - attach-detach-aliases
  # package.interfaces -- Shared function interfaces
  - Agreement
  - Association
  - ConfidenceIntervals
  - Formulas
  # package.utilities -- Constants, concepts, and options
  - concepts
  - constants
  - setDescToolsXOption

- title: Describing Data & Tables
  desc: >
    Compact inspection, descriptive summaries, and one- and two-dimensional tables.
